<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الأستاذ عماد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: gradientFlow 10s ease infinite;
            background-size: 400% 400%;
        }

        /* واجهة الترحيب الأولى */
        #entry-screen {
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 500px;
        }

        #entry-screen h1 {
            color: #fdbb2d;
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: bounceIn 1.5s ease;
        }

        #entry-doctor-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fdbb2d;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            margin: 0 auto 20px;
            display: none;
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        #entry-doctor-photo:hover {
            transform: scale(1.05) rotate(5deg);
        }

        #entry-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
            min-height: 30px;
            color: #fdbb2d;
            font-weight: bold;
        }

        #enter-btn {
            background: linear-gradient(to right, #fdbb2d, #b21f1f);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(253, 187, 45, 0.3);
        }

        #enter-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(253, 187, 45, 0.5);
        }

        /* المحتوى الرئيسي للموقع */
        #main-content {
            display: none;
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        header h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            color: #fdbb2d;
        }

        header p {
            font-size: 1.3rem;
            opacity: 0.9;
        }

        .toggle-admin-btn {
            background: #fdbb2d;
            color: #1a2a6c;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: absolute;
            left: 0;
            top: 0;
        }

        .toggle-admin-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(253, 187, 45, 0.4);
        }

        section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            animation: slideUp 1s ease-out;
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(253, 187, 45, 0.1);
            border-color: rgba(253, 187, 45, 0.3);
        }

        section h2 {
            margin-bottom: 15px;
            color: #fdbb2d;
            font-size: 1.8rem;
            text-align: center;
        }

        .display-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            font-size: 1.2rem;
            margin-bottom: 15px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #fdbb2d;
        }

        input[type="text"], input[type="file"], textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 1.1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #fdbb2d;
            box-shadow: 0 0 10px rgba(253, 187, 45, 0.3);
        }

        button.action-btn {
            background: linear-gradient(to right, #fdbb2d, #b21f1f);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin: 15px auto 0;
            display: block;
            max-width: 200px;
        }

        button.action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(253, 187, 45, 0.4);
        }

        #main-photo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        #main-photo-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fdbb2d;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
            display: none;
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        #main-photo-preview:hover {
            transform: scale(1.05) rotate(5deg);
        }

        .admin-panel {
            display: none;
            width: 100%;
            margin-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.2);
            padding-top: 15px;
            animation: slideDown 0.5s ease-out;
        }

        .assignment-wrapper {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .assignment-wrapper:hover {
            transform: scale(1.02);
        }

        .assignment-wrapper img {
            max-width: 120px;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .assignment-wrapper img:hover {
            transform: scale(1.1);
        }

        .download-link {
            display: block;
            margin-top: 8px;
            color: #fdbb2d;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .download-link:hover {
            color: #ff4757;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            border: 3px solid #fdbb2d;
            animation: zoomIn 0.4s ease-out;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            left: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-modal:hover {
            color: #ff4757;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes bounceIn {
            0%, 20%, 40%, 60%, 80%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            70% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <!-- صفحة الترحيب والدخول (للطلاب والمستخدمين) -->
    <div id="entry-screen">
        <h1>موقع الأستاذ عماد</h1>
        <img id="entry-doctor-photo" src="#" alt="صورة الأستاذ">
        <div id="entry-text">مرحباً بكم في موقعي التعليمي</div>
        <br>
        <button id="enter-btn">إدخال</button>
    </div>

    <!-- المحتوى الرئيسي للموقع -->
    <div id="main-content" class="container">
        <header id="intro">
            <button id="toggle-admin-btn" class="toggle-admin-btn">لوحة التحكم</button>
            <h1>الأستاذ عماد</h1>
            <p>مرحباً بك في موقعي التعليمي</p>
        </header>

        <main>
            <section id="schedule">
                <h2>مواعيد الحصص والدروس</h2>
                
                <div class="input-group">
                    <label>التاريخ:</label>
                    <div id="display-date" class="display-box">لم يتم تحديده بعد</div>
                </div>

                <div class="input-group">
                    <label>السنتر:</label>
                    <div id="display-center" class="display-box">لم يتم تحديده بعد</div>
                </div>

                <div class="input-group">
                    <label>التفاصيل:</label>
                    <div id="display-details" class="display-box">لا توجد تفاصيل حالياً</div>
                </div>

                <!-- لوحة التحكم المحمية بالكامل بكلمة السر -->
                <div id="admin-panel" class="admin-panel">
                    <h3>لوحة تعديل المواعيد</h3>
                    <div class="input-group" style="margin-top: 10px;">
                        <label for="lesson-date">تعديل التاريخ:</label>
                        <input type="text" id="lesson-date" placeholder="مثال: 16 يونيو">
                    </div>

                    <div class="input-group">
                        <label for="center-name">تعديل السنتر:</label>
                        <input type="text" id="center-name" placeholder="مثال: سنتر الفضل">
                    </div>

                    <div class="input-group">
                        <label for="lesson-details">تعديل التفاصيل:</label>
                        <textarea id="lesson-details" placeholder="أدخل تفاصيل ومواعيد الحصص هنا..."></textarea>
                    </div>
                    <button id="save-schedule" class="action-btn">حفظ التعديلات</button>

                    <!-- إعدادات شاشة الترحيب المحمية -->
                    <hr style="border: 0; border-top: 1px solid rgba(255, 255, 255, 0.2); margin: 20px 0;">
                    <h3>إعدادات شاشة الترحيب</h3>
                    <div class="input-group">
                        <label for="welcome-photo-input" class="action-btn" style="cursor: pointer; display: inline-block; max-width: none;">اختيار صورة الترحيب</label>
                        <input type="file" id="welcome-photo-input" accept="image/*" style="display: none;">
                    </div>

                    <div class="input-group" style="margin-top: 15px;">
                        <label for="welcome-text-input">تعديل نص الترحيب:</label>
                        <input type="text" id="welcome-text-input" placeholder="اكتب النص هنا...">
                    </div>
                    <button id="save-welcome" class="action-btn">حفظ الترحيب</button>
                </div>
            </section>

            <section id="doctor-photo">
                <h2>صورة الأستاذ في الموقع</h2>
                <div id="main-photo-container">
                    <img id="main-photo-preview" src="#" alt="صورة الأستاذ">
                    <div class="admin-panel">
                        <label for="photo-input" class="action-btn" style="cursor: pointer; display: inline-block; max-width: none;">اختيار الصورة</label>
                        <input type="file" id="photo-input" accept="image/*" style="display: none;">
                    </div>
                </div>
            </section>

            <section id="assignments">
                <h2>صور الواجبات</h2>
                <div class="admin-panel">
                    <input type="file" id="assignment-input" accept="image/*" multiple>
                </div>
                <div id="assignment-gallery"></div>
            </section>
        </main>
    </div>

    <!-- نافذة تكبير الصور -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script>
        const entryScreen = document.getElementById('entry-screen');
        const mainContent = document.getElementById('main-content');
        const enterBtn = document.getElementById('enter-btn');
        const entryDoctorPhoto = document.getElementById('entry-doctor-photo');
        const entryText = document.getElementById('entry-text');

        const toggleAdminBtn = document.getElementById('toggle-admin-btn');
        const adminPanels = document.querySelectorAll('.admin-panel');
        
        const lessonDateInput = document.getElementById('lesson-date');
        const centerNameInput = document.getElementById('center-name');
        const lessonDetailsInput = document.getElementById('lesson-details');
        const saveScheduleBtn = document.getElementById('save-schedule');

        const displayDate = document.getElementById('display-date');
        const displayCenter = document.getElementById('display-center');
        const displayDetails = document.getElementById('display-details');

        const photoInput = document.getElementById('photo-input');
        const mainPhotoPreview = document.getElementById('main-photo-preview');
        const welcomeTextInput = document.getElementById('welcome-text-input');
        const saveWelcomeBtn = document.getElementById('save-welcome');
        const welcomePhotoInput = document.getElementById('welcome-photo-input');
        
        const assignmentInput = document.getElementById('assignment-input');
        const assignmentGallery = document.getElementById('assignment-gallery');

        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('img01');
        const closeModal = document.getElementsByClassName('close-modal')[0];

        enterBtn.addEventListener('click', function() {
            entryScreen.style.display = 'none';
            mainContent.style.display = 'block';
        });

        toggleAdminBtn.addEventListener('click', function() {
            const password = prompt("أدخل كلمة السر الخاصة بالماستر:");
            if (password === "1234") {
                adminPanels.forEach(panel => {
                    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
                });
                toggleAdminBtn.textContent = adminPanels[0].style.display === 'block' ? 'إخفاء لوحة التحكم' : 'لوحة التحكم';
                alert("مرحباً بك يا أستاذ عماد، يمكنك التعديل الآن.");
            } else {
                alert("كلمة السر غير صحيحة!");
            }
        });

        saveScheduleBtn.addEventListener('click', function() {
            if(lessonDateInput.value) displayDate.textContent = lessonDateInput.value;
            if(centerNameInput.value) displayCenter.textContent = centerNameInput.value;
            if(lessonDetailsInput.value) displayDetails.textContent = lessonDetailsInput.value;
            alert("تم حفظ التعديلات بنجاح وتحديثها للطلاب!");
        });

        saveWelcomeBtn.addEventListener('click', function() {
            if(welcomeTextInput.value) entryText.textContent = welcomeTextInput.value;
            alert("تم تحديث شاشة الترحيب بنجاح!");
        });

        welcomePhotoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    entryDoctorPhoto.setAttribute('src', e.target.result);
                    entryDoctorPhoto.style.display = 'block';
                    mainPhotoPreview.setAttribute('src', e.target.result);
                    mainPhotoPreview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        photoInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    mainPhotoPreview.setAttribute('src', e.target.result);
                    mainPhotoPreview.style.display = 'block';
                    
                    entryDoctorPhoto.setAttribute('src', e.target.result);
                    entryDoctorPhoto.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        mainPhotoPreview.addEventListener('click', function() {
            if(this.src && this.style.display === 'block') {
                modal.style.display = "flex";
                modalImg.src = this.src;
            }
        });

        entryDoctorPhoto.addEventListener('click', function() {
            if(this.src && this.style.display === 'block') {
                modal.style.display = "flex";
                modalImg.src = this.src;
            }
        });

        assignmentInput.addEventListener('change', function() {
            assignmentGallery.innerHTML = '';
            const files = this.files;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const wrapper = document.createElement('div');
                    wrapper.setAttribute('class', 'assignment-wrapper');

                    const img = document.createElement('img');
                    img.setAttribute('src', e.target.result);
                    
                    img.addEventListener('click', function() {
                        modal.style.display = "flex";
                        modalImg.src = this.src;
                    });

                    const downloadLink = document.createElement('a');
                    downloadLink.setAttribute('href', e.target.result);
                    downloadLink.setAttribute('download', file.name);
                    downloadLink.setAttribute('class', 'download-link');
                    downloadLink.textContent = 'تنزيل الواجب';

                    wrapper.appendChild(img);
                    wrapper.appendChild(downloadLink);
                    assignmentGallery.appendChild(wrapper);
                }
                reader.readAsDataURL(file);
            }
        });

        closeModal.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
